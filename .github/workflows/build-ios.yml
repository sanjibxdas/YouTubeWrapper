name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-14 is the only GitHub-hosted image that carries Xcode 15, the last
    # Xcode able to target iOS 12. It is scheduled for retirement on 2026-11-02.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test injected scripts
        run: node tests/inject-smoke-test.js

      - name: Select Xcode 15.4
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            echo "::error::No Xcode 15.x on this runner; iOS 12 deployment target unsupported."
            ls /Applications | grep Xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Build
        run: ./scripts/make-ipa.sh

      - name: Verify deployment target
        run: |
          set -euo pipefail
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Payload/YouTubeWrapper.app/Info.plist)
          echo "MinimumOSVersion: $MINOS"
          test "$MINOS" = "12.0"

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeWrapper-ipa
          path: build/YouTubeWrapper.ipa
          retention-days: 90
