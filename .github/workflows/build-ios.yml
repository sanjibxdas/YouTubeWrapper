name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-14 is the only GitHub-hosted image that carries Xcode 15, the last
    # Xcode able to target iOS 12. It is scheduled for retirement on 2026-11-02.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test injected scripts
        run: node tests/inject-smoke-test.js

      - name: Select Xcode 15.4
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            echo "::error::No Xcode 15.x on this runner; iOS 12 deployment target unsupported."
            ls /Applications | grep Xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Build
        run: ./scripts/make-ipa.sh

      - name: Verify deployment target
        run: |
          set -euo pipefail
          APP=build/App.xcarchive/Products/Applications/YouTubeWrapper.app
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          echo "MinimumOSVersion: $MINOS"
          test "$MINOS" = "12.0"
          # The deb ships the same bundle; confirm the executable bit survived packaging.
          node -e '
            const zlib = require("zlib"), fs = require("fs");
            const b = fs.readFileSync("build/YouTubeWrapper.deb");
            let off = 8, members = [];
            while (off + 60 <= b.length) {
              const n = b.slice(off, off + 16).toString().trim();
              const s = parseInt(b.slice(off + 48, off + 58).toString().trim(), 10);
              members.push({ n, s, st: off + 60 });
              off += 60 + s + (s % 2);
            }
            const d = members.find((m) => m.n === "data.tar.gz");
            if (!d) throw new Error("no data.tar.gz in deb");
            const raw = zlib.gunzipSync(b.slice(d.st, d.st + d.s));
            let p = 0, found = false;
            while (p + 512 <= raw.length) {
              const name = raw.slice(p, p + 100).toString().replace(/\0.*$/, "").trim();
              if (!name) break;
              const size = parseInt(raw.slice(p + 124, p + 136).toString().replace(/\0/g, "").trim(), 8) || 0;
              const mode = raw.slice(p + 100, p + 108).toString().replace(/\0/g, "").trim();
              if (name.endsWith("YouTubeWrapper.app/YouTubeWrapper")) {
                if (mode !== "0000755") throw new Error("main binary is not executable: " + mode);
                found = true;
              }
              p += 512 + Math.ceil(size / 512) * 512;
            }
            if (!found) throw new Error("main binary missing from deb payload");
            console.log("deb payload OK: executable present with mode 0755");
          '

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeWrapper-ipa
          path: build/YouTubeWrapper.ipa
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeWrapper-deb
          path: build/YouTubeWrapper.deb
          retention-days: 90
